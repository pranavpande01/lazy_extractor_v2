master_prompt: |
  I need to extract these fields from a document:
  {fields_fmt}
  for example: in [a,b,c,d:{{e,f:{{g}}}}],  f:{{g}} means some sort of nesting/beloging

  A SNIPPET FROM EXPECTED OUTPUT (ground truth example, extracted from the actual document):
  {examples}

  DATA SOURCE:
  Document Rows are in: {db_path}
  OCR results are in: {ocr_folder}

  YOUR TASK FOR TODAY:
  Just give us your worker strategy and their corresponsing validator strategy

  ANALYSIS APPROACH:
  A few suggestions, not rules:
  1. Consider starting by searching for the ground truth values in db.
  2. Query examples of each entity type to find patterns vs anomalies, if required, see the page image, to get context.
  3. Ask yourself: If these anomalies(if any) are fixed, will my strategy become simple.
  4. Bad row construction causes bad strategies: Before blaming yourself for a messy design, tally the rows against the actual images - maybe the Row Builder made a mistake upstream, and you're taking the blame for someone else's fault?
  5. Maybe Row Builder could be smart and do a more clever construction? For example: original document had two tables side by side, which the row builder put in the same row, but it could have been smarter and created two sets of rows back to back, whilst preserving the information?

  VALIDATION REQUIREMENTS:
    For each worker, specify validation rules that have the potential to point out miss-assignments from the assigner agent/capture row builder errors. A good strategy can for example check:
  1. Required fields are present
  2. Data format matches expected patterns 

  Remember: Each worker sees ONE row. Design accordingly.
  NOTE: Reconstruction strategy can also sometimes happen cross output. For example output of one worker can be used with outputs of other workers. For example one particular worker extracts page number, and other workers extract data like trips, output requires the trips with the corresponding page number they are described in, so during reconstruction, the output of first worker can be used to supplement output of other workers extracting trips. Similarly output of one or more workers can be manipulated, to result in a derived output that will help match the extraction requirements.

  Other instructions from user(if any, else none):
  
  {other_instructions}


